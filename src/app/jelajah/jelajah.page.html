<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon slot="icon-only" name="menu-outline" class="navbar-icon"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="ion-text-center">
      <div class="logo-container">
        <img src="assets/icon/Logo.png" alt="Logo" class="logo-img" />
        <span class="logo-text">T!CKET</span>
      </div>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="notifications" class="navbar-icon"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="light-bg">

  <div class="search-section">
    <ion-searchbar 
      placeholder="Cari event menarik yuk..." 
      class="custom-searchbar"
      search-icon="search-outline">
    </ion-searchbar>
  </div>

  <div class="event-list-container">
  
  <ion-card class="event-card-vertical" *ngFor="let item of daftarEvent">
    <div class="image-container">
      <img [src]="item.imgUrl" alt="Event Image" class="card-img" /> 
      <ion-button fill="clear" class="favorite-btn">
        <ion-icon name="heart" class="heart-icon"></ion-icon> 
      </ion-button>
    </div>
    
    <ion-card-content>
      <h2 class="event-title">{{ item.title }}</h2>
      
      <div class="date-row">
        <ion-icon name="calendar-outline"></ion-icon>
        <span class="date-text">{{ item.date }}</span>
      </div>
      
      <div class="card-footer">
        <div class="price-container">
          <span class="price-label">Mulai dari</span>
          <span class="price-value">{{ item.minPrice }}</span>
        </div>
        <ion-button size="small" class="buy-btn" (click)="goToDetail(item)">Beli</ion-button>
      </div>
    </ion-card-content>
  </ion-card>

</div>

</ion-content>

<ion-footer class="ion-no-border">
  <ion-tab-bar slot="bottom" class="custom-tabbar">
    <ion-tab-button tab="beranda" routerLink="/home" routerDirection="root">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Beranda</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="jelajah" routerLink="/jelajah" routerDirection="root" class="tab-selected">
      <ion-icon name="compass-sharp"></ion-icon> <ion-label>Jelajah</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="pesanan" routerLink="/pesanan" routerDirection="root">
      <ion-icon name="ticket-outline"></ion-icon> 
      <ion-label>Pesanan</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profil" routerLink="/profile" routerDirection="root">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
